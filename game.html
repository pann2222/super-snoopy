<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUPER SNOOPY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent;touch-action:none}
body{background:#000;overflow:hidden}
#wrap{max-width:900px;margin:0 auto;padding:6px}
canvas{width:100%;height:58vh;min-height:320px;border:3px solid #000;border-radius:14px;display:block;background:#fff}
.hud{display:flex;justify-content:center;gap:6px;margin:6px 0;flex-wrap:wrap}
.hud div{background:#fff;border:2px solid #000;border-radius:999px;padding:5px 10px;font-weight:900;font-size:13px;color:#000}
.hud div.inv{background:#e52521;color:#fff;animation:kedip .5s infinite}
@keyframes kedip{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.hud button{border:2px solid #000;border-radius:999px;padding:5px 10px;font-weight:900;background:#000;color:#fff;cursor:pointer}
.progress{height:8px;background:#fff;border:2px solid #000;border-radius:999px;overflow:hidden;margin:4px 0}
.progress i{display:block;height:100%;background:#e52521;width:0%}
.controls{display:flex;justify-content:space-between;padding:10px 6px 0}
.leftBtns{display:flex;gap:12px}.rightBtns{display:flex}
.btn{width:74px;height:74px;border:3px solid #000;border-radius:50%;font-size:32px;font-weight:900;background:#fff;color:#000;box-shadow:4px 4px 0 #e52521;display:flex;align-items:center;justify-content:center}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #e52521;background:#e52521;color:#fff}
.btn.jump{width:90px;height:90px;background:#e52521;color:#fff;font-size:38px;border:3px solid #000;box-shadow:4px 4px 0 #000}
.logoSuper{color:#FFD700 !important;-webkit-text-stroke:2px #000;text-shadow:4px 4px 0 #000 !important}
.logoSnoopy{background:linear-gradient(to right, #e52521 0%, #e52521 50%, #ffffff 50%, #ffffff 100%);-webkit-background-clip:text;background-clip:text;color:transparent !important;-webkit-text-stroke:2px #000;filter:drop-shadow(4px 4px 0 #000)}
.snoopyLogo{width:82px;height:82px;margin:0 auto;animation:loncat 1s ease-in-out infinite;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.4))}
.snoopyLogoIntro{width:110px;height:110px;animation:dogIn 1s ease-out, dogBounce 1s 1s ease-in-out infinite;filter:drop-shadow(6px 6px 0 rgba(0,0,0,.4))}
@keyframes loncat{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes dogIn{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
@keyframes dogBounce{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
#intro{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;background:#fff}
#intro.hide{animation:introOut .5s forwards}
@keyframes introOut{to{opacity:0;visibility:hidden}}
.introSky{position:absolute;inset:0;background:linear-gradient(#fff 0%, #ffe0e0 50%, #e52521 100%)}
.introName{position:relative;z-index:3;font-size:42px;line-height:0.9;text-align:center;animation:nameIn .8s .3s both}
@keyframes nameIn{from{opacity:0;transform:scale(0.5) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.introSub{position:relative;z-index:3;background:#000;color:#fff;font-size:11px;font-weight:900;letter-spacing:3px;padding:5px 10px;border-radius:999px;margin-top:8px}
.introBar{position:relative;z-index:3;width:200px;height:12px;background:#fff;border:3px solid #000;border-radius:999px;overflow:hidden;margin-top:10px}
.introBar i{display:block;height:100%;background:#e52521;width:0%;animation:load 2.2s forwards}
@keyframes load{to{width:100%}}
#cover{position:fixed;inset:0;z-index:99;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;padding:6px}
.coverBox{position:relative;z-index:5;width:100%;max-width:420px;text-align:center;margin:auto;display:flex;flex-direction:column;gap:5px;max-height:100dvh;justify-content:center}
.logo{font-size:36px;line-height:0.9}
.logo small{display:block;font-size:15px;color:#000;margin-top:2px;letter-spacing:3px;text-shadow:2px 2px 0 #e52521}
.cloud{position:absolute;background:#fff;border:3px solid #000;border-radius:999px;animation:gerak 20s linear infinite;opacity:.5}
.cloud1{width:80px;height:26px;top:6%;left:-10%}.cloud2{width:60px;height:20px;top:14%;left:-5%;animation-duration:15s}.cloud3{width:90px;height:26px;top:3%;left:-15%;animation-duration:26s}
@keyframes gerak{from{transform:translateX(0)}to{transform:translateX(120vw)}}
.hill{position:absolute;bottom:0;width:180px;height:70px;background:#000;border-radius:50% 50% 0 0}
.hill1{left:-40px}.hill2{right:-30px;width:200px;height:85px;background:#e52521}
.pipe{position:absolute;bottom:22px;background:#000;border:3px solid #000}
.pipe:before{content:'';position:absolute;top:0;left:-6px;right:-6px;height:14px;background:#e52521;border:3px solid #000;border-radius:6px}
.pipe1{left:3%;width:42px;height:55px}.pipe2{right:3%;width:42px;height:75px}
.ground{position:absolute;bottom:0;left:0;right:0;height:22px;background:#000;border-top:4px solid #e52521}
.coinFly{position:absolute;font-size:16px;animation:putar 1.5s ease-in-out infinite}
.coinFly1{left:6%;top:12%}.coinFly2{right:6%;top:18%;animation-delay:.4s}.coinFly3{left:12%;top:60%;animation-delay:.8s}.coinFly4{right:12%;top:60%;animation-delay:.2s}
@keyframes putar{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(180deg)}}
.startBtn{background:#e52521;color:#fff;border:4px solid #000;border-radius:999px;padding:10px 16px;font-size:19px;font-weight:900;width:100%;cursor:pointer;box-shadow:4px 4px 0 #000;animation:kedip2 1s infinite}
@keyframes kedip2{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.shopBtn{background:#fff;color:#000;border:3px solid #000;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:900;width:100%;cursor:pointer;box-shadow:3px 3px 0 #e52521}
.levelGrid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;background:#fff;border:3px solid #000;border-radius:10px;padding:5px}
.levelGrid button{border:2px solid #000;border-radius:6px;padding:4px 0;font-weight:900;font-size:10px;cursor:pointer;background:#fff;color:#000}
.levelGrid button.done{background:#000;color:#fff}
.levelGrid button.cur{background:#e52521;color:#fff}
.levelGrid button.hard{background:#fff;color:#e52521;border-color:#e52521}
.levelGrid button.hell{background:#000;color:#fff}
#over{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:98;padding:16px}
.overBox{background:#fff;border:3px solid #000;border-radius:16px;padding:20px;text-align:center;max-width:340px;width:100%}
.overBox button{background:#000;color:#fff;border:none;border-radius:999px;padding:12px 18px;font-weight:900;width:100%;margin-top:10px;cursor:pointer}
.overBox button.big{font-size:18px;padding:16px;background:#e52521}
#shop{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:150;padding:12px}
.shopBox{background:#fff;border:3px solid #000;border-radius:16px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;padding:14px;position:relative}
.shopCloseX{position:absolute;top:10px;right:10px;width:36px;height:36px;border:2px solid #000;border-radius:50%;background:#e52521;color:#fff;font-size:20px;font-weight:900;cursor:pointer;z-index:10;line-height:1;display:flex;align-items:center;justify-content:center}
.shopBox h2{text-align:center;color:#000;padding-right:36px}
.shopCoin{text-align:center;background:#e52521;color:#fff;border:2px solid #000;border-radius:999px;padding:8px;font-weight:900;margin:8px 0;font-size:15px}
.skinItem{display:flex;align-items:center;gap:10px;border:2px solid #000;border-radius:12px;padding:8px;margin:6px 0;background:#fff}
.skinItem.active{border-color:#e52521;background:#fff0f0;box-shadow:0 0 0 2px #e52521}
.skinIcon{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;border:2px solid #000;flex-shrink:0;overflow:hidden}
.skinInfo{flex:1}
.skinInfo b{font-size:14px;color:#000}.skinInfo small{display:block;font-size:11px;color:#555}
.skinItem button{border:2px solid #000;border-radius:999px;padding:8px 10px;font-weight:900;cursor:pointer;white-space:nowrap}
.skinItem button.buy{background:#e52521;color:#fff}
.skinItem button.use{background:#000;color:#fff}
.skinItem button.used{background:#000;color:#fff}
.closeShop{background:#000;color:#fff;border:none;border-radius:999px;padding:12px;width:100%;font-weight:900;margin-top:8px;cursor:pointer}
</style>
</head>

<script>
let introDone=false;
function skipIntro(){if(introDone) return; introDone=true; let el=document.getElementById('intro'); el.classList.add('hide'); setTimeout(()=>el.style.display='none',500);}
setTimeout(skipIntro,2600);
const SKINS=[
{id:'standar',name:'STANDAR',price:0,desc:'Putih item merah - Snoopy asli',body:'#ffffff',ear:'#000000',acc:'none',emoji:'S'},
{id:'merah',name:'MERAH API',price:50,desc:'Putih + syal merah gede',body:'#ffffff',ear:'#000000',acc:'hero',emoji:'R'},
{id:'hitam',name:'HITAM PEKAT',price:100,desc:'Full item, mata merah',body:'#000000',ear:'#e52521',acc:'robot',emoji:'H'},
{id:'putih',name:'PUTIH BERSIH',price:150,desc:'Full putih, kuping item',body:'#ffffff',ear:'#000000',acc:'bow',emoji:'P'},
{id:'ninja',name:'NINJA HITAM',price:250,desc:'Topi ninja item + mata tajam',body:'#ffffff',ear:'#000000',acc:'ninja',emoji:'N'},
{id:'astronot',name:'ASTRONOT',price:400,desc:'Helm kaca putih item',body:'#ffffff',ear:'#000000',acc:'helm',emoji:'A'},
{id:'hero',name:'SUPERHERO',price:600,desc:'Jubah merah + topeng item',body:'#ffffff',ear:'#000000',acc:'hero',emoji:'S'},
{id:'raja',name:'RAJA MERAH',price:900,desc:'Mahkota merah + jubah item',body:'#ffffff',ear:'#000000',acc:'crown',emoji:'K'},
{id:'robot',name:'ROBOT HITAM',price:1300,desc:'Badan item + mata laser merah',body:'#222222',ear:'#e52521',acc:'robot',emoji:'R'},
{id:'legend',name:'LEGEND MERAH',price:2000,desc:'PUTIH ITEM MERAH, GLOWING, PALING GG!',body:'#ffffff',ear:'#000000',acc:'gold',emoji:'★'},
];
let totalCoin=parseInt(localStorage.getItem('snoopyTotalCoin')||0);
let owned=JSON.parse(localStorage.getItem('snoopyOwned')||'["standar"]');
let curSkin=localStorage.getItem('snoopySkin')||'standar';
let kebalBought=false;
function getSkin(){return SKINS.find(s=>s.id===curSkin)||SKINS[0];}
function saveShop(){localStorage.setItem('snoopyTotalCoin',totalCoin);localStorage.setItem('snoopyOwned',JSON.stringify(owned));localStorage.setItem('snoopySkin',curSkin);updateShopUI();}
function updateShopUI(){
document.getElementById('totalCoin').textContent=totalCoin;
document.getElementById('shopBtnCoin').textContent=totalCoin;
document.getElementById('shopCoin').textContent=totalCoin;
document.getElementById('hudSkin').textContent=getSkin().name;
let ks=document.getElementById('kebalStatus'); if(ks) ks.textContent=kebalBought?'AKTIF - KEBAL!':'BELUM BELI';
let ksb=document.getElementById('kebalShopBtn'); if(ksb){ksb.textContent=kebalBought?'✓ AKTIF':'BELI 70⭐';}
}
function buyKebal(){
if(kebalBought){alert('Udah kebal! Gas sampe bendera, ga bakal mati!');return;}
if(totalCoin<70){alert('Koin kurang! Butuh 70⭐ buat kebal, kamu cuma '+totalCoin+'⭐. Menang dulu 1 level, koin baru masuk.');return;}
if(!confirm('Beli KEBAL seharga 70⭐ ?\nKebal 1x level ini, nabrak hama + tawon ga mati. Kalo ganti level / ulang, harus beli lagi.')) return;
totalCoin-=70;kebalBought=true;invincibleUntil=999999999999;saveShop();updateHud();alert('YEAY! KEBAL AKTIF! Tabrak aja hama + tawon nya, ga bakal mati sampe level ini kelar!');
}
function openShop(){renderShop();document.getElementById('shop').style.display='flex';updateShopUI();}
function closeShop(){document.getElementById('shop').style.display='none';}
function renderShop(){
let list=document.getElementById('skinList');list.innerHTML='';
SKINS.forEach(s=>{
let has=owned.includes(s.id);let isCur=curSkin===s.id;
let div=document.createElement('div');div.className='skinItem'+(isCur?' active':'');
let btn='';
if(isCur) btn='<button class="used">✓ DIPAKE</button>';
else if(has) btn='<button class="use" onclick="useSkin(\''+s.id+'\')">PAKE</button>';
else if(totalCoin>=s.price) btn='<button class="buy" onclick="buySkin(\''+s.id+'\')">BELI '+s.price+'⭐</button>';
else btn='<button class="buy" style="opacity:.5" onclick="alert(\'Koin kurang! Butuh '+s.price+'⭐, kamu cuma '+totalCoin+'⭐\')">🔒 '+s.price+'⭐</button>';
div.innerHTML='<div class="skinIcon" style="background:'+s.body+';color:'+(s.body==='#000000'||s.body==='#222222'?'#fff':'#000')+'">'+s.emoji+'</div><div class="skinInfo"><b>'+s.name+'</b><small>'+s.desc+'</small><small>'+(s.price===0?'GRATIS':'Harga: '+s.price+'⭐')+' '+(has?'• SUDAH PUNYA':'')+'</small></div>'+btn;
list.appendChild(div);
});
}
function buySkin(id){let s=SKINS.find(x=>x.id===id);if(totalCoin<s.price){alert('Koin kurang!');return;}if(!confirm('Beli '+s.name+' seharga '+s.price+'⭐ ?')) return;totalCoin-=s.price;owned.push(id);curSkin=id;saveShop();renderShop();alert('YEAY! '+s.name+' kebeli!');}
function useSkin(id){curSkin=id;saveShop();renderShop();}
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
let W=860,H=460,started=false,coins=0,score=0,currentLevel=1,gameOver=false,win=false,camX=0,time=0,unlocked=parseInt(localStorage.getItem('snoopyUnlock')||1),levelLength=2200,loopRunning=false,finished=false,levelCoins=0,levelScore=0,winCounted=false;
let player={x:40,y:340,w:30,h:40,vx:0,vy:0,onGround:false,face:1,run:0};
let keys={},grounds=[],blocks=[],pipes=[],coinList=[],enemyList=[],waspList=[],starList=[],popups=[],flag={x:3000,y:160,w:10,h:240},floatPlats=[];
let invincibleUntil=0;
function isInvincible(){return kebalBought || time*1000 < invincibleUntil;}
function getTheme(lv){
if(lv<=10) return {sky1:'#ffffff',grass:'#e52521',dirt:'#000000',pipe:'#000000'};
if(lv<=15) return {sky1:'#ffe0e0',grass:'#e52521',dirt:'#000000',pipe:'#e52521'};
return {sky1:'#000000',grass:'#e52521',dirt:'#ffffff',pipe:'#e52521'};
}
function getLength(lv){return 2000 + lv*650;}
function buildLevel(lv,keepKebal){
if(!keepKebal){kebalBought=false;invincibleUntil=0;}
coins=0;levelCoins=0;levelScore=0;score=0;finished=false;winCounted=false;gameOver=false;win=false;
levelLength=getLength(lv);let length=levelLength;
let goombaCount=3+Math.floor(lv/1.2); if(goombaCount>14) goombaCount=14;
let waspCount= lv<=3?1 : lv<=10?2+Math.floor(lv/3) : lv<=15?5 : 7+Math.floor(lv/4); if(waspCount>10) waspCount=10;
grounds=[{x:0,y:400,w:length+600,h:80}];
floatPlats=[];
if(lv>=11){floatPlats.push({x:length*0.4,y:340,w:180,h:16});floatPlats.push({x:length*0.7,y:320,w:180,h:16});}
blocks=[];pipes=[];coinList=[];enemyList=[];waspList=[];starList=[];popups=[];
let blockCount=4+Math.floor(length/500);
for(let i=0;i<blockCount;i++){let bx=350+i*360+Math.random()*80;if(bx>length-200)break;blocks.push({x:bx,y:300,w:36,h:36,type:Math.random()>0.4?'?':'brick',hit:false});}
let pipeCount=2+Math.floor(length/800);
for(let i=0;i<pipeCount;i++){let px=650+i*650+Math.random()*100;if(px>length-200)break;let h=lv<=10?70:lv<=15?90:110;pipes.push({x:px,y:400-h,w:60,h:h});}
let coinCount=10+Math.floor(length/160);
for(let i=0;i<coinCount;i++) coinList.push({x:250+i*180,y:200+Math.sin(i)*30,taken:false,ph:i});
for(let i=0;i<goombaCount;i++){let speed=lv<=10?0.6:lv<=15?1.0:1.5;let ex=550+i*(length/goombaCount*0.85);enemyList.push({x:ex,y:360,w:32,h:30,vx:-speed,alive:true,ph:i});}
for(let i=0;i<waspCount;i++){let wx=800+i*(length/waspCount*0.9);let speed= lv<=10?1.0: lv<=15?1.6: 2.2;waspList.push({x:wx,baseY:180+Math.random()*120,w:30,h:24,vx:-speed,alive:true,ph:i*1.7,dir:1});}
flag={x:length+150,y:160,w:10,h:240};player.x=40;player.y=340;player.vx=0;player.vy=0;camX=0;
if(!kebalBought) invincibleUntil=0;
document.getElementById('lvl').textContent=lv;renderLevelGrid();updateHud();updateShopUI();
}
function renderLevelGrid(){let g=document.getElementById('levelGrid');g.innerHTML='';for(let i=1;i<=30;i++){let b=document.createElement('button');b.textContent=i;if(i<unlocked)b.className='done';if(i===currentLevel)b.className+=' cur';if(i>=11&&i<=15)b.className+=' hard';if(i>=16)b.className+=' hell';if(i>unlocked)b.style.opacity=0.5;b.onclick=()=>{if(i<=unlocked){currentLevel=i;buildLevel(i);startGame();}};g.appendChild(b);}}
function startGame(){started=true;document.getElementById('cover').style.display='none';document.getElementById('over').style.display='none';ensureLoop();}
function toCover(){document.getElementById('cover').style.display='flex';started=false;renderLevelGrid();updateShopUI();}
function restart(){let keep=kebalBought;buildLevel(currentLevel,keep);updateHud();document.getElementById('over').style.display='none';document.getElementById('cover').style.display='none';started=true;ensureLoop();}
function tryAgain(){restart();}
function ensureLoop(){if(!loopRunning){loopRunning=true;requestAnimationFrame(loop);}}
function nextLevel(){if(currentLevel<30){currentLevel++;if(currentLevel>unlocked){unlocked=currentLevel;localStorage.setItem('snoopyUnlock',unlocked);}buildLevel(currentLevel);document.getElementById('over').style.display='none';started=true;updateHud();ensureLoop();}else{showOver('🏆 TAMAT!','30 LEVEL KELAR!');}}
function updateHud(){document.getElementById('coin').textContent=coins;document.getElementById('score').textContent=score;let p=Math.min(100,player.x/flag.x*100);document.getElementById('prog').style.width=p+'%';let sh=document.getElementById('shieldBox'), sht=document.getElementById('shield');if(isInvincible()){if(kebalBought){sht.textContent='KEBAL BELI';}else{let left=Math.ceil((invincibleUntil-time*1000)/1000);sht.textContent='KEBAL '+left+'s';}sh.classList.add('inv');}else{sht.textContent='OFF';sh.classList.remove('inv');}}
function addCoin(n){coins+=n;levelCoins+=n;updateHud();}
function addScore(n){score+=n;levelScore+=n;updateHud();}
function showOver(t,tx){document.getElementById('overTitle').textContent=t;document.getElementById('overText').textContent=tx;document.getElementById('over').style.display='flex';if(t.includes('MATI')||t.includes('JATUH')){document.getElementById('overBtn').textContent='↻ COBA LAGI';document.getElementById('overBtn').onclick=()=>tryAgain();}}
function drawSnoopy(x,y){
let skin=getSkin();let leg=Math.sin(player.run)*6;let body=skin.body, ear=skin.ear;
ctx.save();
if(player.face<0){ctx.translate(x+15,0);ctx.scale(-1,1);ctx.translate(-(x+15),0);}
if(isInvincible()){ctx.fillStyle='rgba(229,37,33,0.4)';ctx.beginPath();ctx.arc(x+15,y+18,28,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e52521';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x+15,y+18,30,0,Math.PI*2);ctx.stroke();if(Math.floor(time*10)%2==0) ctx.globalAlpha=0.6;}
if(skin.acc==='gold'){ctx.fillStyle='rgba(229,37,33,0.3)';ctx.beginPath();ctx.arc(x+15,y+18,32,0,Math.PI*2);ctx.fill();}
ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(x+15,y+40,18,4,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#000';ctx.fillRect(x+4,y+32+Math.max(0,leg),8,8);ctx.fillRect(x+18,y+32+Math.max(0,-leg),8,8);
ctx.fillStyle=body;ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.fillRect(x+2,y+14,26,20);ctx.strokeRect(x+2,y+14,26,20);
ctx.fillStyle='#e52521';ctx.fillRect(x+0,y+24,30,5);
ctx.beginPath();ctx.arc(x+15,y+9,14,0,Math.PI*2);ctx.fillStyle=body;ctx.fill();ctx.stroke();
ctx.fillStyle=ear;ctx.beginPath();ctx.ellipse(x+5,y+9,5,11,0,0,Math.PI*2);ctx.fill();
if(skin.acc==='bow'){ctx.fillStyle='#e52521';ctx.beginPath();ctx.arc(x+8,y+2,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+18,y+2,5,0,Math.PI*2);ctx.fill();}
if(skin.acc==='ninja'){ctx.fillStyle='#000';ctx.fillRect(x-2,y+2,34,6);ctx.fillStyle='#e52521';ctx.fillRect(x+10,y+3,12,4);}
if(skin.acc==='helm'){ctx.fillStyle='rgba(255,255,255,0.6)';ctx.beginPath();ctx.arc(x+15,y+10,18,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#000';ctx.stroke();}
if(skin.acc==='hero'){ctx.fillStyle='#e52521';ctx.fillRect(x+2,y+6,26,5);ctx.fillStyle='#e52521';ctx.beginPath();ctx.moveTo(x+2,y+34);ctx.lineTo(x-8,y+44);ctx.lineTo(x+2,y+44);ctx.fill();}
if(skin.acc==='crown'){ctx.fillStyle='#e52521';ctx.fillRect(x+5,y-6,20,8);ctx.beginPath();ctx.moveTo(x+5,y-6);ctx.lineTo(x+10,y-12);ctx.lineTo(x+15,y-6);ctx.lineTo(x+20,y-12);ctx.lineTo(x+25,y-6);ctx.fill();}
if(skin.acc==='robot'){ctx.fillStyle='#e52521';ctx.beginPath();ctx.arc(x+18,y+6,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.fillRect(x+2,y+20,26,4);}
if(skin.acc==='gold'){ctx.fillStyle='#e52521';ctx.fillRect(x+5,y-6,20,8);ctx.beginPath();ctx.moveTo(x+5,y-6);ctx.lineTo(x+10,y-12);ctx.lineTo(x+15,y-6);ctx.lineTo(x+20,y-12);ctx.lineTo(x+25,y-6);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 8px Arial';ctx.fillText('★',x+12,y+1);}
ctx.fillStyle='#000';ctx.beginPath();ctx.arc(x+18,y+6,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+27,y+13,3,0,Math.PI*2);ctx.fill();
ctx.restore();
ctx.globalAlpha=1;
}
function draw(){
let theme=getTheme(currentLevel);ctx.fillStyle=theme.sky1;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#000';for(let i=0;i<7;i++){let ax=(i*380-camX*0.2)%3200;if(ax<0)ax+=3200;ctx.beginPath();ctx.arc(ax,60,22,0,Math.PI*2);ctx.arc(ax+24,60,16,0,Math.PI*2);ctx.fill();}
ctx.fillStyle=theme.dirt;ctx.fillRect(0,400,W,60);
ctx.fillStyle=theme.grass;ctx.fillRect(0,400,W,14);
ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.strokeRect(-2,400,W+4,60);
for(let f of floatPlats){let sx=f.x-camX;ctx.fillStyle='#000';ctx.fillRect(sx,f.y,f.w,f.h);ctx.strokeStyle='#e52521';ctx.strokeRect(sx,f.y,f.w,f.h);}
for(let p of pipes){let sx=p.x-camX;if(sx<-100||sx>900)continue;ctx.fillStyle=theme.pipe;ctx.fillRect(sx,p.y,p.w,p.h);ctx.fillStyle='#e52521';ctx.fillRect(sx,p.y,p.w,14);ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.strokeRect(sx,p.y,p.w,14);ctx.strokeRect(sx,p.y,p.w,p.h);}
for(let b of blocks){let sx=b.x-camX;if(sx<-100||sx>900)continue;if(b.hit){ctx.fillStyle='#000';ctx.fillRect(sx,b.y,b.w,b.h);ctx.strokeRect(sx,b.y,b.w,b.h);continue;}if(b.type==='?'){ctx.fillStyle='#e52521';ctx.fillRect(sx,b.y,b.w,b.h);ctx.strokeStyle='#000';ctx.strokeRect(sx,b.y,b.w,b.h);ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.fillText('?',sx+11,b.y+25);}else{ctx.fillStyle='#fff';ctx.fillRect(sx,b.y,b.w,b.h);ctx.strokeStyle='#000';ctx.strokeRect(sx,b.y,b.w,b.h);}}
for(let c of coinList){if(c.taken)continue;let sx=c.x-camX;ctx.fillStyle='#e52521';ctx.beginPath();ctx.arc(sx,c.y+Math.sin(time*3+c.ph)*4,11,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#000';ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.fillText('★',sx-5,c.y+4);}
for(let s of starList){if(s.taken)continue;let sx=s.x-camX;let yy=s.y+Math.sin(time*5)*4;ctx.fillStyle='#e52521';ctx.beginPath();ctx.arc(sx,yy,14,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.fillText('★',sx-8,yy+5);}
for(let e of enemyList){if(!e.alive)continue;let sx=e.x-camX;ctx.fillStyle='#000';ctx.beginPath();ctx.arc(sx+16,e.y+14,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx+11,e.y+10,4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(sx+22,e.y+10,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e52521';ctx.fillRect(sx+2,e.y+26,12,6);ctx.fillRect(sx+18,e.y+26,12,6);}
for(let w of waspList){if(!w.alive)continue;let sx=w.x-camX;let wy=w.baseY+Math.sin(time*3+w.ph)*30;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(sx+15,wy+12,16,12,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#000';ctx.fillRect(sx+8,wy+4,4,16);ctx.fillRect(sx+18,wy+4,4,16);ctx.fillStyle='#e52521';ctx.beginPath();ctx.ellipse(sx+8,wy+2,10,5,-0.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(sx+22,wy+2,10,5,0.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(sx+24,wy+10,3,0,Math.PI*2);ctx.fill();}
let fx=flag.x-camX;ctx.fillStyle='#000';ctx.fillRect(fx,flag.y,6,flag.h);ctx.fillStyle='#e52521';ctx.beginPath();ctx.moveTo(fx,flag.y);ctx.lineTo(fx+60,flag.y+18);ctx.lineTo(fx,flag.y+36);ctx.fill();
for(let p of popups){ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText(p.t,p.x-camX,p.y);ctx.fillText(p.t,p.x-camX,p.y);}
if(!gameOver && !finished) drawSnoopy(player.x-camX,player.y);
}
function die(msg){if(gameOver||finished) return;gameOver=true;showOver('MATI! 💀',msg+' • Koin '+levelCoins+'⭐ ILANG! Ga masuk total karena kalah. Total tetep: '+totalCoin+'⭐');}
function loop(){
loopRunning=true;time+=0.016;
if(started&&!gameOver&&!finished){
let maxSpeed=3.8,accel=0.7;
if(keys['ArrowLeft']){player.vx=Math.max(-maxSpeed,player.vx-accel);player.face=-1;player.run+=0.25;}
else if(keys['ArrowRight']){player.vx=Math.min(maxSpeed,player.vx+accel);player.face=1;player.run+=0.25;}
else{player.vx*=0.82;if(Math.abs(player.vx)<0.1)player.vx=0;}
if(keys[' ']&&player.onGround){player.vy=-12.5-Math.abs(player.vx)*0.2;player.onGround=false;}
if(!keys[' ']&&player.vy<-5)player.vy=-5;
player.vy+=0.62;if(player.vy>14)player.vy=14;
let oldBottom=player.y+player.h;player.x+=player.vx;player.y+=player.vy;player.onGround=false;if(player.x<0)player.x=0;
let solids=[...grounds,...pipes,...floatPlats];
for(let p of solids){if(player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>p.y&&player.y+player.h<p.y+28&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.onGround=true;}}
for(let b of blocks){if(b.hit)continue;if(player.x+player.w>b.x&&player.x<b.x+b.w&&player.y+player.h>b.y&&player.y<b.y+b.h){if(player.vy>0&&oldBottom<=b.y+5){player.y=b.y-player.h;player.vy=0;player.onGround=true;}else if(player.vy<0&&player.y>=b.y+b.h-12){
b.hit=true;player.vy=4;
if(b.type==='?'){
if(Math.random()<0.4){starList.push({x:b.x,y:b.y-20,taken:false,vy:-2});popups.push({t:'⭐ BINTANG!',x:b.x,y:b.y-30});}
else{addCoin(1);addScore(100);popups.push({t:'+1⭐',x:b.x,y:b.y-10});}
}else{addScore(50);popups.push({t:'BRUK!',x:b.x,y:b.y-10});}
updateHud();
}}}
popups=popups.map(p=>({t:p.t,x:p.x,y:p.y-0.8})).filter(p=>p.y>100);
for(let s of starList){if(s.taken)continue;s.y+=s.vy;if(s.y>300) s.vy=0.5; if(s.y<260) s.vy=-0.5;
if(Math.abs(player.x-s.x)<30&&Math.abs(player.y-s.y)<36){s.taken=true;invincibleUntil=time*1000+8000;addScore(200);popups.push({t:'🛡️ KEBAL 8 DETIK!',x:player.x,y:player.y-20});updateHud();}}
for(let c of coinList){if(!c.taken&&Math.abs(player.x-c.x)<28&&Math.abs(player.y-c.y)<38){c.taken=true;addCoin(1);addScore(50);updateHud();}}
for(let e of enemyList){if(!e.alive)continue;e.x+=e.vx;if(e.x<200||e.x>flag.x)e.vx*=-1;
if(player.x+player.w>e.x&&player.x<e.x+e.w&&player.y+player.h>e.y&&player.y<e.y+e.h){
if(isInvincible()){e.alive=false;addCoin(3);addScore(300);popups.push({t:'BOOM! +3⭐',x:e.x,y:e.y-10});}
else if(player.vy>1){e.alive=false;player.vy=-9;addCoin(3);addScore(200);popups.push({t:'+3⭐',x:e.x,y:e.y-10});updateHud();}
else{die('Kena hama item! Sekali kena langsung mati!');}
}}
for(let w of waspList){if(!w.alive)continue;w.x+=w.vx;w.y=w.baseY+Math.sin(time*3+w.ph)*30;
if(w.x<200||w.x>flag.x) w.vx*=-1;
let wy=w.baseY+Math.sin(time*3+w.ph)*30;
if(player.x+player.w>w.x&&player.x<w.x+w.w&&player.y+player.h>wy&&player.y<wy+w.h){
if(isInvincible()){w.alive=false;addCoin(3);addScore(400);popups.push({t:'TAWON MATI! +3⭐',x:w.x,y:wy-10});}
else if(player.vy>1){w.alive=false;player.vy=-9;addCoin(3);addScore(300);popups.push({t:'+3⭐',x:w.x,y:wy-10});updateHud();}
else{die('Kena sengat tawon! Sekali kena langsung mati!');}
}}
camX=Math.max(0,player.x-180);
if(player.x+player.w>flag.x && !winCounted){
winCounted=true;finished=true;
if(currentLevel>=unlocked){unlocked=Math.min(30,currentLevel+1);localStorage.setItem('snoopyUnlock',unlocked);}
addScore(500+currentLevel*100);
totalCoin+=levelCoins;saveShop();updateHud();
let wasKebal=kebalBought;kebalBought=false;updateShopUI();
document.getElementById('overBtn').textContent=currentLevel>=30?'🏆 TAMAT':'➜ LV '+(currentLevel+1);document.getElementById('overBtn').onclick=()=>nextLevel();
showOver('LV '+currentLevel+' CLEAR! 🎉','Dapet level ini: '+levelCoins+'⭐ MASUK! • Skor: '+levelScore+' • Total koin: '+totalCoin+'⭐'+(wasKebal?' • Kebal habis, beli lagi buat LV berikut':''));
}
if(player.y>500){die('Jatuh! Sekali jatoh langsung mati!');}
updateHud();
}
draw();requestAnimationFrame(loop);
}
buildLevel(1);ensureLoop();updateShopUI();
document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' ')e.preventDefault();});
document.addEventListener('keyup',e=>keys[e.key]=false);
function bind(id,key){let b=document.getElementById(id);let s=e=>{e.preventDefault();keys[key]=true;};let en=e=>{e.preventDefault();keys[key]=false;};b.addEventListener('touchstart',s,{passive:false});b.addEventListener('touchend',en,{passive:false});b.addEventListener('touchcancel',en,{passive:false});b.addEventListener('mousedown',s);b.addEventListener('mouseup',en);b.addEventListener('mouseleave',en);}
bind('left','ArrowLeft');bind('right','ArrowRight');bind('jump',' ');
updateHud();
</script>
</body>
</html>
